[package]
name = "worktree-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Create isolated, ready-to-code Git worktrees"
repository = "https://github.com/yungweng/wt"

[[bin]]
name = "wt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }
cliclack = "0.5"
console = "0.16"
fs4 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tempfile = "3.23"
